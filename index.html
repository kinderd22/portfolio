:root{--paper:#f6f5f2;--ink:#000;--dark:#1c1c1c;--blue:#a6d4e4;--grey:#d9d9d9;--mute:#6f7b80;
--f-head:Coolvetica,"Helvetica Neue",Arial,sans-serif;--f-text:Cygre,"Helvetica Neue",Arial,sans-serif;--pad:clamp(16px,3vw,44px);
box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html{scroll-behavior:smooth;scroll-padding-top:var(--mm-h,56px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}html.lock{padding-right:calc(env(safe-area-inset-right,0px) + var(--sbw,0px))}html.lock .mm-hdr{right:var(--sbw,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{background:var(--paper);color:var(--ink);font:400 clamp(13px,1.05vw,15px)/1.4 var(--f-text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3,.head{font-family:var(--f-head);font-weight:400;line-height:.92;letter-spacing:-.02em}
.ph{background:var(--grey);display:grid;place-items:center;color:#a9a9a9;font-family:var(--f-head);font-size:clamp(14px,1.6vw,24px);position:relative;overflow:hidden}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.zoom{transition:transform .6s cubic-bezier(.2,.7,.2,1)}@media(hover:hover){a:hover .zoom,button:hover .zoom,.zoom:hover{transform:scale(1.04)}}
.frame{overflow:hidden}
/* ===== Шапка (образец 2.html), стили изолированы классом .mm-hdr ===== */
.mm-hdr{--mm-gap:clamp(8px,1.1vw,16px);--mm-pad:clamp(16px,2.4vw,36px);--mm-line:#b5b5b5;--mm-dim:#777;
position:fixed;top:0;left:0;right:0;z-index:40;max-height:100vh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;
display:flex;justify-content:space-between;align-items:center;gap:16px;
padding:calc(14px + env(safe-area-inset-top,0px)) calc(var(--mm-gap) + var(--mm-pad) + env(safe-area-inset-right,0px)) 14px calc(var(--mm-gap) + var(--mm-pad) + env(safe-area-inset-left,0px));
background:rgba(208,208,208,.92);border-bottom:1px solid var(--mm-line);
font-family:var(--f-text);font-size:15px;line-height:1.45;color:#000;animation:mmFade .9s .5s both}
@keyframes mmFade{from{opacity:0}to{opacity:1}}
.mm-logo{font-size:13px;letter-spacing:0;font-family:var(--f-text);color:inherit;min-width:0}
.mm-logo .mm-dim{color:var(--mm-dim)}
.mm-nav{display:flex;gap:clamp(14px,2vw,32px);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.mm-nav a{position:relative;padding:4px 0;color:inherit;background:none}
.mm-nav a::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.mm-nav a:hover::after,.mm-nav a:focus-visible::after,.mm-nav a[aria-current]::after{transform:scaleX(1)}
.mm-burger{display:none;padding:10px 0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:inherit}
#app{padding-top:calc(var(--mm-h,56px) - env(safe-area-inset-top,0px))}
@media(max-width:900px){
 .mm-hdr{padding:calc(6px + env(safe-area-inset-top,0px)) calc(var(--mm-gap) + 8px + env(safe-area-inset-right,0px)) 6px calc(var(--mm-gap) + 8px + env(safe-area-inset-left,0px));flex-wrap:wrap}
 .mm-logo{flex:1 1 0;min-width:0}
 .mm-burger{display:block;min-height:44px;flex:none}
 .mm-nav{display:none;width:100%;flex-direction:column;gap:0;padding-bottom:10px}
 .mm-hdr.open .mm-nav{display:flex}
 .mm-nav a{padding:14px 0;border-top:1px solid var(--mm-line);font-size:14px}
 .mm-nav a::after{display:none}
 .mm-nav a[aria-current]{text-decoration:underline;text-underline-offset:4px}
}
/* ===== Блоки «Услуги» и «Контакты» (образец 2.html), стили изолированы префиксом sx- ===== */
.sx-block{--sx-gap:clamp(8px,1.1vw,16px);--sx-pad:clamp(16px,2.4vw,36px);--sx-white:#fff;--sx-black:#050505;--sx-ink:#000;--sx-dim:#777;--sx-line:#b5b5b5;
--sx-cool:Coolvetica,"Helvetica Neue",Arial,sans-serif;--sx-cygre:Cygre,"Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;margin:0 0 var(--sx-gap);padding:var(--sx-pad) var(--pad);font-family:var(--sx-cygre);font-size:15px;line-height:1.45;overflow-wrap:break-word}
.sx-block *,.sx-block *::before,.sx-block *::after{box-sizing:border-box}
.sx-white{background:var(--sx-white);color:var(--sx-ink)}.sx-black{background:var(--sx-black);color:#fff}
.sx-cool{font-family:var(--sx-cool);font-weight:400;letter-spacing:-.03em;line-height:.86}
.sx-mono{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.sx-big{font-size:clamp(36px,6vw,110px);line-height:.92}
.sx-giant{font-size:clamp(44px,9vw,170px)}
.sx-ln{display:block}
.sx-block :where(a){color:inherit;text-decoration:none}
.sx-block :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sx-hint{margin:clamp(12px,1.4vw,18px) 0 0;font-size:clamp(15px,1.45vw,21px);line-height:1.35;color:#6a6a6a;text-shadow:0 1px 3px rgba(0,0,0,.22),0 3px 12px rgba(0,0,0,.14)}
.sx-hint+.sx-svc-list{margin-top:clamp(20px,4vw,56px)}
.sx-svc-list{margin-top:clamp(28px,5vw,70px);border-top:1px solid var(--sx-line)}
.sx-svc{border-bottom:1px solid var(--sx-line)}
.sx-svc-head{width:100%;display:grid;grid-template-columns:70px 1fr 30px;align-items:baseline;gap:12px;padding:20px 0;text-align:left}
.sx-svc-title{font-size:clamp(30px,6vw,100px);line-height:.95;transition:transform .4s;min-width:0}
@media(hover:hover){.sx-svc-head:hover .sx-svc-title{transform:translateX(10px)}}
.sx-svc-body{max-height:0;overflow:hidden;margin:0 0 0 82px;max-width:460px;transition:max-height .5s,padding .5s}
.sx-svc.on .sx-svc-body{max-height:50em;padding-bottom:22px}
.sx-services{margin-bottom:0}
.sx-contact{min-height:70vh;min-height:70svh;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.sx-contact .sx-giant{letter-spacing:-.01em}
.sx-contact-text{max-width:min(30em,100%);font-size:clamp(18px,2vw,30px);line-height:1.3;color:#ccc}
.sx-btn{align-self:flex-start;display:inline-flex;gap:14px;padding:18px 28px;background:#fff;color:#000;font-size:13px;letter-spacing:.06em;transition:opacity .25s}
@media(hover:hover){.sx-btn:hover{opacity:.8}}
.sx-btn i{display:inline-block;font-style:normal;transition:transform .3s}@media(hover:hover){.sx-btn:hover i{transform:translateX(6px)}}
.sx-contact-links{display:flex;gap:18px 48px;flex-wrap:wrap;border-top:1px solid #333;padding-top:18px}
.sx-contact-links.sx-mono{font-size:14px}
.sx-contact-links a{display:inline-flex;align-items:center;gap:12px;min-width:0;overflow-wrap:anywhere}
.sx-contact-links .sx-tel{white-space:nowrap}
@media(min-width:1100px){.sx-contact-links .sx-tel{margin-left:auto}}
@media(max-width:767px){.sx-contact-links .sx-tel{flex:0 0 100%}}

.sx-block :focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media(max-width:767px){
 .sx-svc-head{grid-template-columns:36px 1fr 20px}.sx-svc-body{margin-left:48px}
 .sx-contact{min-height:60vh;min-height:60svh}.sx-btn{width:100%;justify-content:space-between}
}
.hero{margin:0 var(--pad);aspect-ratio:2.05/1;display:grid;place-items:center;text-align:center;background:var(--grey);position:relative}
.hero h1{font-size:clamp(40px,8.4vw,128px);color:#111}
.hero h1 span{display:block;font-size:.53em;margin-top:.06em}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.hero video.hero-bg{opacity:.9}
.hero.is-playing img.hero-bg{opacity:0}
.hero.has-bg h1{text-shadow:0 0 .1em rgba(255,255,255,.55),0 0 .45em rgba(255,255,255,.4)}
.hero-hit{position:absolute;inset:0;z-index:2;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero-hit:focus-visible{outline:2px solid var(--blue);outline-offset:-6px}
.hero-play{display:none;position:absolute;z-index:1;left:clamp(12px,2vw,28px);bottom:clamp(8px,1.4vw,20px);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);color:#111;font-size:16px;align-items:center;justify-content:center;padding-left:3px;pointer-events:none}
.hero.no-auto .hero-play{display:flex}
.hero .lab{position:absolute;right:clamp(12px,2vw,28px);bottom:clamp(8px,1.4vw,20px);color:#aaa;font-family:var(--f-head);font-size:clamp(20px,3vw,44px)}
.big span{display:inline-block;transform:translateX(-.02em)}
.big{font-size:21.8vw;line-height:.82;letter-spacing:-.035em;padding:0;margin:calc(clamp(5px,.45vw,9px) - .09em) var(--pad) 2vw;text-align:center;white-space:nowrap}
.dirs{display:grid;grid-template-columns:1.05fr auto 1.15fr;gap:var(--pad);padding:0 var(--pad) var(--pad);align-items:end}
.tag{font-size:10px;display:block;margin-bottom:10px}
