<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Имя Фамилия] — рилс-мейкер, продюсер, монтажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--bg2:#141415;--fg:#f2efe8;--mute:#8a8a86;--ac:#c6ff3d;--line:rgba(242,239,232,.15);--pad:clamp(18px,4vw,56px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:Onest,system-ui,Arial,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.wrap{padding:0 var(--pad)}
.rule{border-top:1px solid var(--line)}
h1,h2,h3{font-weight:800;letter-spacing:-.035em;line-height:.95}
/* header */
header{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px var(--pad);mix-blend-mode:normal;background:linear-gradient(var(--bg),rgba(12,12,13,0))}
.logo{font-weight:800;letter-spacing:-.02em;font-size:15px}
nav{display:flex;gap:28px}
nav a{font-size:13px;color:var(--fg);opacity:.75;transition:.25s}
nav a:hover,nav a.on{opacity:1;color:var(--ac)}
.burger{display:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:10px 0}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border:1px solid var(--fg);border-radius:100px;font-size:14px;font-weight:500;transition:.3s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0c0c0d}
.btn.pri:hover{background:var(--fg);border-color:var(--fg)}
/* placeholder / media */
.ph{position:relative;width:100%;background:linear-gradient(var(--a,135deg),#1b1b1c,#0f0f10 60%,#202021);overflow:hidden}
.ph .lab{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ph .tc{position:absolute;right:12px;top:10px;font-size:10px;letter-spacing:.1em;color:var(--mute);font-variant-numeric:tabular-nums}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.r169{aspect-ratio:16/9}.r916{aspect-ratio:9/16}
.card:hover .ph img,.card:hover .ph video,.card:hover .ph::before{transform:scale(1.04)}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;transition:.3s;background:rgba(12,12,13,.35)}
.play::after{content:"";border-left:14px solid var(--fg);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.card:hover .play{background:var(--ac);border-color:var(--ac)}
.card:hover .play::after{border-left-color:#0c0c0d}
.meta{display:flex;justify-content:space-between;gap:12px;padding:12px 0 0;align-items:baseline}
.meta h3{font-size:clamp(16px,1.6vw,22px);letter-spacing:-.02em;line-height:1.1;font-weight:700}
.meta .tag{margin-top:4px;display:block}
.arrow{color:var(--ac);transition:.3s;display:inline-block}
.card:hover .arrow{transform:translateX(6px)}
/* hero */
.hero{min-height:100svh;position:relative;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr auto;padding:96px var(--pad) 28px;gap:0 20px}
.hero .top{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .vid{grid-column:5/13;grid-row:2;align-self:start;margin-top:18px;position:relative}
.hero h1{grid-column:1/10;grid-row:2;align-self:end;font-size:clamp(42px,8.4vw,142px);position:relative;z-index:2;margin-bottom:28px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero .bot{grid-column:1/-1;grid-row:3;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.scroll{display:flex;align-items:center;gap:10px}
.scroll i{display:block;width:1px;height:34px;background:var(--mute);position:relative;overflow:hidden}
.scroll i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ac);animation:sc 2s infinite}
@keyframes sc{to{top:110%}}
/* sections */
section{padding:clamp(70px,10vw,150px) var(--pad) 0}
.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:36px;gap:20px;flex-wrap:wrap}
.sh h2{font-size:clamp(34px,5.5vw,84px)}
.dirs{display:grid;grid-template-columns:5fr 7fr;gap:20px;align-items:stretch}
.dir{display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);padding:20px;min-height:420px;transition:.4s;position:relative;overflow:hidden}
.dir:hover{border-color:var(--ac)}
.dir h3{font-size:clamp(30px,4vw,64px);margin:10px 0}
.dir p{color:var(--mute);max-width:32ch}
.dir .strip{display:flex;gap:10px;margin:22px 0}
.dir .strip .ph{flex:1}
.dir.film .strip{display:block}
.dir .go{display:flex;justify-content:space-between;font-size:14px;font-weight:500;border-top:1px solid var(--line);padding-top:14px}
.feat{display:grid;grid-template-columns:repeat(12,1fr);gap:48px 20px;align-items:start}
.f1{grid-column:1/9}.f2{grid-column:9/13;margin-top:90px}.f3{grid-column:2/6}.f4{grid-column:7/13;margin-top:60px}.f5{grid-column:1/5}.f6{grid-column:6/13}
.svc{border-top:1px solid var(--line);display:grid;grid-template-columns:90px 1.2fr 1fr;gap:20px;padding:34px 0;align-items:baseline;transition:.3s}
.svc:hover{padding-left:14px}
.svc h3{font-size:clamp(28px,4.4vw,68px)}
.svc p{color:var(--mute);max-width:42ch}
.about{display:grid;grid-template-columns:5fr 6fr;gap:clamp(24px,5vw,80px);align-items:end}
.about h2{font-size:clamp(34px,5vw,76px);margin-bottom:28px}
.about p{color:#cfccc4;margin-bottom:16px;max-width:52ch}
.pts{margin-top:28px}.pts div{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:16px}
.pts b{color:var(--ac);font-weight:500;font-size:12px;padding-top:3px}
.logos{margin-top:60px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.logos div{border:1px dashed var(--line);padding:22px 10px;text-align:center}
/* contact */
#contact{padding-top:clamp(90px,12vw,180px);padding-bottom:36px}
#contact h2{font-size:clamp(46px,11vw,190px);margin:14px 0 28px}
#contact h2 span{color:var(--ac)}
.cl{display:flex;gap:30px;flex-wrap:wrap;margin-top:44px;border-top:1px solid var(--line);padding-top:20px}
.cl a{transition:.25s}.cl a:hover{color:var(--ac)}
.foot{display:flex;justify-content:space-between;margin-top:50px;gap:12px;flex-wrap:wrap}
/* pages */
.ph-head{padding:130px var(--pad) 0;display:grid;grid-template-columns:repeat(12,1fr);gap:20px;align-items:end}
.ph-head h1{grid-column:1/9;font-size:clamp(44px,9vw,150px)}
.ph-head p{grid-column:9/13;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:40px var(--pad) 28px}
.fl{padding:9px 18px;border:1px solid var(--line);border-radius:100px;font-size:13px;transition:.25s;color:var(--mute)}
.fl:hover{color:var(--fg);border-color:var(--fg)}
.fl.on{background:var(--ac);border-color:var(--ac);color:#0c0c0d;font-weight:500}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px;padding:0 var(--pad)}
.vgrid .card:nth-child(4n+2){margin-top:60px}.vgrid .card:nth-child(4n+4){margin-top:30px}
.vgrid .card{cursor:pointer;transition:opacity .4s,transform .4s}
.hid{display:none!important}
.fgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:56px 20px;padding:0 var(--pad)}
.fgrid .card:nth-child(3n+1){grid-column:1/13}.fgrid .card:nth-child(3n+2){grid-column:1/8}.fgrid .card:nth-child(3n){grid-column:8/13;margin-top:80px}
.fgrid .card:nth-child(3n+1) .meta h3{font-size:clamp(28px,4vw,60px)}
.case{padding:130px var(--pad) 0}
.case h1{font-size:clamp(40px,8vw,130px);margin:14px 0 22px;max-width:14ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:26px 0 40px;border-top:1px solid var(--line);padding-top:14px}
.facts b{display:block;font-weight:500;margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);margin:70px 0}
.cols h3{font-size:clamp(24px,3vw,40px);margin-bottom:14px}
.cols p{color:#cfccc4}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gal.v{grid-template-columns:repeat(4,1fr)}
.next{display:block;margin-top:90px;padding:50px var(--pad);border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:.3s}
.next:hover{background:var(--bg2)}
.next h3{font-size:clamp(30px,6vw,96px);margin-top:8px}
/* player */
#pl{position:fixed;inset:0;z-index:100;background:rgba(8,8,9,.96);display:none;align-items:center;justify-content:center;padding:60px 16px 20px}
#pl.open{display:flex}
#pl .box{max-height:100%;max-width:100%;position:relative;background:#000;display:grid;place-items:center}
#pl .box.r169{width:min(1100px,100%)}
#pl .box.r916{height:min(100%,82vh)}
#pl iframe,#pl video{position:absolute;inset:0;width:100%;height:100%;border:0}
#pl .msg{padding:30px;text-align:center;color:var(--mute);font-size:14px;max-width:34ch}
.x{position:absolute;top:14px;right:var(--pad);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:10px}
.x:hover{color:var(--ac)}
.spin{position:absolute;width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
/* tablet */
@media(max-width:1000px){
 .hero .vid{grid-column:3/13}.hero h1{grid-column:1/13}
 .vgrid{grid-template-columns:repeat(3,1fr)}.vgrid .card:nth-child(n){margin-top:0}.vgrid .card:nth-child(3n+2){margin-top:40px}
 .dirs{grid-template-columns:1fr}
 .f1,.f3,.f5{grid-column:1/13}.f2,.f4,.f6{grid-column:4/13;margin-top:0}
 .about{grid-template-columns:1fr}
 .ph-head h1,.ph-head p{grid-column:1/13}
 .gal.v{grid-template-columns:repeat(2,1fr)}
}
/* mobile */
@media(max-width:680px){
 .burger{display:block}
 nav{position:fixed;inset:0;background:var(--bg);flex-direction:column;justify-content:center;gap:10px;padding:var(--pad);transform:translateY(-100%);transition:transform .45s cubic-bezier(.7,0,.2,1)}
 nav.open{transform:none}
 nav a{font-size:34px;font-weight:800;letter-spacing:-.03em;opacity:1}
 header{z-index:60}.logo,.burger{position:relative;z-index:70}
 .hero{display:flex;flex-direction:column;padding-top:84px;gap:0}
 .hero .vid{order:2;margin:20px 0}.hero h1{order:1;margin:30px 0 0}
 .hero .bot{order:3;flex-direction:column;align-items:stretch}.scroll{display:none}
 .btn{justify-content:space-between;width:100%}
 .vgrid{grid-template-columns:repeat(2,1fr);gap:22px 12px}.vgrid .card:nth-child(n){margin-top:0}.vgrid .card:nth-child(2n){margin-top:28px}
 .feat{display:flex;flex-direction:column;gap:36px}.f2,.f4,.f6{margin-left:20%}
 .fgrid{display:flex;flex-direction:column;gap:40px}.fgrid .card:nth-child(n){margin-top:0}
 .svc{grid-template-columns:44px 1fr;gap:6px 10px}.svc p{grid-column:2}
 .logos{grid-template-columns:repeat(2,1fr)}
 .facts{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}
 .gal{grid-template-columns:1fr 1fr}
 .dir{min-height:0}
}
</style>
</head>
<body>
<header>
 <a class="logo" href="#home" id="logo"></a>
 <button class="burger" id="bg" aria-expanded="false" aria-controls="nav">Меню</button>
 <nav id="nav">
  <a href="#vertical" data-r="vertical">Вертикальный контент</a>
  <a href="#film" data-r="film">Горизонтальные проекты</a>
  <a href="#about">Обо мне</a>
  <a href="#contacts">Контакты</a>
 </nav>
</header>
<main id="app"></main>
<div id="pl" role="dialog" aria-modal="true" aria-label="Видеоплеер"><button class="x" id="px">Закрыть ✕</button><div class="box r169" id="pb"></div></div>

<script>
/* ============ КОНТЕНТ: правьте только этот блок ============ */
const SITE={
 name:"[Имя Фамилия]",
 telegram:"[Telegram]", telegramUrl:"",   // например "https://t.me/username"
 email:"[Email]", emailUrl:"",            // например "mailto:name@mail.ru"
 social:"[Социальные сети]", socialUrl:"",
 heroVideo:"",    // ссылка на .mp4 для фонового шоурила (без звука)
 heroPoster:"",   // ссылка на обложку
 photo:""         // ссылка на [Фото]
};
/* video: ссылка на .mp4 / YouTube / Vimeo; poster: ссылка на обложку; cat — категория (фильтр строится сам, пустые не показываются) */
const VERT=[
 {t:"[Название проекта]",cat:"Бренды",role:"[Моя роль]",video:"портфолио/extra_dodiki.mp4",poster:"портфолио/extra_dodiki.jpg",year:"",desc:"",gallery:[]},
 {t:"[Название проекта]",cat:"Эксперты",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Лайфстайл",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Мероприятия",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Бренды",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Эксперты",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Лайфстайл",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Мероприятия",role:"[Моя роль]",video:"",poster:""}
];
const FILM=[
 {t:"[Название проекта]",cat:"Короткометражные фильмы",role:"[Моя роль]",video:"",poster:"",year:"",desc:"",contrib:"",team:"",gallery:[]},
 {t:"[Название проекта]",cat:"Клипы",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Реклама",role:"[Моя роль]",video:"",poster:""},
 {t:"[Название проекта]",cat:"Короткометражные фильмы",role:"[Моя роль]",video:"",poster:""}
];
/* Избранное: [тип, индекс]. Макет: 1 крупный + остальные */
const FEATURED=[["film",0],["vert",0],["film",1],["vert",1],["vert",2],["film",2]];
/* ============================================================ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=$("#app");
$("#logo").textContent=SITE.name;
const href=(u,f)=>u||f;

/* media */
function media(it,ratio,i,tc){
 const a=(i*47+120)%360;
 const inner=it.poster?`<img src="${esc(it.poster)}" alt="${esc(it.t)}" loading="lazy">`:`<span class="lab">${it.video?"":"[Видео] · "}[Обложка]</span>`;
 return `<div class="ph ${ratio}" style="--a:${a}deg">${inner}<span class="tc">${String(i+1).padStart(2,"0")} / ${tc||"00:00"}</span></div>`;
}
const num=n=>String(n+1).padStart(2,"0");
function vCard(it,i,mode){
 const link=mode==="page"?"":`data-play="vert-${i}"`;
 return `<article class="card rv" data-cat="${esc(it.cat)}" ${link} ${link?'tabindex="0" role="button"':''}>
 <div style="position:relative">${media(it,"r916",i)}<span class="play"></span></div>
 <div class="meta"><div><h3>${esc(it.t)}</h3><span class="tag">${esc(it.cat)} · ${esc(it.role)}</span></div><a class="tag arrow" href="#p-vert-${i}" aria-label="Страница кейса">↗</a></div></article>`;
}
function fCard(it,i,big){
 return `<a class="card rv" href="#p-film-${i}" data-cat="${esc(it.cat)}">
 <div style="position:relative">${media(it,"r169",i)}<span class="play"></span></div>
 <div class="meta"><div><h3>${esc(it.t)}</h3><span class="tag">${esc(it.cat)} · ${esc(it.role)}${it.year?" · "+esc(it.year):""}</span></div><span class="arrow">→</span></div></a>`;
}
function feat(k,n){
 const [type,i]=FEATURED[k];const it=(type==="film"?FILM:VERT)[i];if(!it)return"";
 const cls="f"+(k+1);
 if(type==="film")return `<div class="${cls}">${fCard(it,i)}</div>`;
 return `<div class="${cls}" style="max-width:${k===0?'none':'320px'}">${vCard(it,i,"page").replace(/<a class="tag arrow"[^>]*>↗<\/a>/,"")}</div>`.replace('<article class="card rv"','<a href="#p-vert-'+i+'" class="card rv" style="display:block"').replace("</article>","</a>");
}

/* contact (на каждой странице) */
function contact(){
 const L=(txt,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(txt)} ↗</a>`:`<span>${esc(txt)}</span>`;
 return `<section id="contact" class="wrap"><div class="rule" style="padding-top:20px"><span class="tag">Финальная сцена · Контакты</span></div>
 <h2 class="rv">Обсудим<br><span>ваш проект</span></h2>
 <p class="rv" style="color:#cfccc4;max-width:46ch;margin-bottom:28px">Расскажите о задаче — предложу формат, подберу команду и доведу видео от идеи до финального кадра.</p>
 <a class="btn pri rv" href="${esc(href(SITE.telegramUrl,SITE.emailUrl||"#contacts"))}">Написать мне <span>→</span></a>
 <div class="cl">${L(SITE.telegram,SITE.telegramUrl)}${L(SITE.email,SITE.emailUrl)}${L(SITE.social,SITE.socialUrl)}</div>
 <div class="foot tag"><span>© ${SITE.name}</span><span>Vertical / Film / Commercial</span></div></section>`;
}

/* pages */
function home(){
 const fv=VERT.slice(0,3);
 return `<div class="hero">
 <div class="top tag"><span>${esc(SITE.name)}</span><span>Рилс-мейкер / продюсер / монтажёр</span></div>
 <div class="vid rv in">${SITE.heroVideo?`<div class="ph r169"><video src="${esc(SITE.heroVideo)}" ${SITE.heroPoster?`poster="${esc(SITE.heroPoster)}"`:""} autoplay muted loop playsinline></video></div>`:`<div class="ph r169"><span class="lab">[Видео] · фоновый шоурил</span><span class="tc">REEL / 00:00</span></div>`}</div>
 <h1 class="rv in">Создаю видео — от идеи до <em>финального кадра</em></h1>
 <div class="bot"><div class="cta"><a class="btn pri" href="#work">Смотреть работы ↓</a><a class="btn" href="#contacts">Обсудить проект</a></div>
 <div class="tag">Vertical content / Film / Commercial</div><div class="scroll tag"><i></i>Scroll</div></div></div>

 <section id="dirs" class="wrap"><div class="sh"><h2 class="rv">Два мира,<br>один взгляд</h2><span class="tag">01 — Направления</span></div>
 <div class="dirs">
  <a class="dir card rv" href="#vertical"><div><span class="tag">Vertical content · 9:16</span><h3>Вертикальный контент</h3><p>Контент, который удерживает внимание</p></div>
   <div class="strip">${fv.map((it,i)=>media(it,"r916",i)).join("")}</div>
   <div class="go"><span>Смотреть вертикальные работы</span><span class="arrow">→</span></div></a>
  <a class="dir film card rv" href="#film"><div><span class="tag">Film / Horizontal projects · 16:9</span><h3>Горизонтальные проекты</h3><p>Истории, образы и визуальные миры</p></div>
   <div class="strip">${media(FILM[0],"r169",0)}</div>
   <div class="go"><span>Смотреть проекты</span><span class="arrow">→</span></div></a>
 </div></section>

 <section id="work" class="wrap"><div class="sh"><h2 class="rv">Избранные<br>проекты</h2><a class="tag" href="#film" style="color:var(--ac)">Все проекты →</a></div>
 <div class="feat">${FEATURED.map((_,k)=>feat(k)).join("")}</div></section>

 <section id="services" class="wrap"><div class="sh"><h2 class="rv">Услуги</h2><span class="tag">03 — Чем могу помочь</span></div>
 ${[["01","Создание рилсов","От идеи и сценария до съёмки и финального монтажа.","Подойдёт брендам, экспертам и мероприятиям, которым нужен регулярный вертикальный контент."],
 ["02","Продюсирование","Организация производства, подбор команды и сопровождение проекта.","Если нужен человек, который соберёт съёмку целиком и отвечает за результат."],
 ["03","Монтаж","Работа с историей, ритмом, звуком и визуальным повествованием.","Когда материал уже снят и его нужно превратить в цельное видео."]]
 .map(s=>`<div class="svc rv"><span class="tag">${s[0]}</span><div><h3>${s[1]}</h3><p style="margin-top:12px">${s[2]}</p></div><p>${s[3]}</p></div>`).join("")}
 <div class="rule"></div></section>

 <section id="about" class="wrap"><div class="about">
  <div class="rv">${SITE.photo?`<div class="ph" style="aspect-ratio:4/5"><img src="${esc(SITE.photo)}" alt="${esc(SITE.name)}"></div>`:`<div class="ph" style="aspect-ratio:4/5"><span class="lab">[Фото]</span></div>`}</div>
  <div class="rv"><span class="tag">04 — Обо мне</span><h2 style="margin-top:12px">Идея, производство и монтаж — в одних руках</h2>
  <p>[Короткий текст о вашем подходе — два-три абзаца своими словами.]</p>
  <div class="pts"><div><b>01</b>Работа с историей и визуальным языком</div><div><b>02</b>Понимание задач проекта</div><div><b>03</b>Идея, производство и монтаж в единой логике</div></div></div>
 </div>
 <div class="logos tag"><div>[Логотип клиента]</div><div>[Логотип клиента]</div><div>[Логотип клиента]</div><div>[Логотип клиента]</div></div></section>`+contact();
}

function listPage(type){
 const V=type==="vertical",data=V?VERT:FILM;
 const cats=[...new Set(data.map(d=>d.cat).filter(Boolean))];
 const head=V?["Vertical content","Вертикальный контент","Рилсы и короткие вертикальные видео для брендов, экспертов и мероприятий. Быстрый ритм, крупная деталь, внимание с первой секунды."]
 :["Film","Горизонтальные проекты","Короткометражные фильмы, клипы и рекламные проекты. Свет, атмосфера и визуальное повествование."];
 return `<div class="ph-head"><h1 class="rv in">${head[1]}</h1><p class="rv in"><span class="tag">${head[0]}</span><br>${head[2]}</p></div>
 <div class="wrap" style="margin-top:36px"><div class="ph ${V?"r916":"r169"}" style="${V?"aspect-ratio:21/9;":"aspect-ratio:21/9;"}"><span class="lab">[Видео] · ${V?"вертикальный шоурил":"главный кадр"}</span></div></div>
 <div class="filters" id="fl"><button class="fl on" data-f="*">Все</button>${cats.map(c=>`<button class="fl" data-f="${esc(c)}">${esc(c)}</button>`).join("")}</div>
 <div class="${V?"vgrid":"fgrid"}" id="gr">${data.map((it,i)=>V?vCard(it,i):fCard(it,i)).join("")}</div>`+contact();
}

function detail(type,i){
 const V=type==="vert",data=V?VERT:FILM,it=data[i];
 if(!it)return listPage(V?"vertical":"film");
 const nx=data[(i+1)%data.length],ni=(i+1)%data.length;
 const gal=(it.gallery&&it.gallery.length?it.gallery:[0,1,2,3].map(()=>null));
 return `<div class="case"><a class="tag" href="#${V?"vertical":"film"}">← ${V?"Вертикальный контент":"Горизонтальные проекты"}</a>
 <h1 class="rv in">${esc(it.t)}</h1>
 <div class="facts"><div><span class="tag">Формат</span><b>${esc(it.cat)}</b></div><div><span class="tag">Моя роль</span><b>${esc(it.role)}</b></div><div><span class="tag">Год</span><b>${esc(it.year||"—")}</b></div></div>
 <div class="card" data-play="${type}-${i}" tabindex="0" role="button" style="cursor:pointer;${V?"max-width:380px":""}"><div style="position:relative">${media(it,V?"r916":"r169",i)}<span class="play"></span></div></div>
 <div class="cols"><div><span class="tag">${V?"Задача":"О проекте"}</span><h3>Задача и идея</h3><p>${esc(it.desc||"[Краткое описание проекта и поставленной задачи]")}</p></div>
 <div><span class="tag">Мой вклад</span><h3>Что сделал я</h3><p>${esc(it.contrib||"[Описание вашего вклада и зоны ответственности]")}</p>${it.team?`<p style="margin-top:14px" class="tag">Команда: ${esc(it.team)}</p>`:""}</div></div>
 <span class="tag">${V?"Дополнительные видео":"Кадры и материалы со съёмок"}</span>
 <div class="gal ${V?"v":""}" style="margin-top:14px">${gal.map((g,k)=>g?`<div class="ph ${V?"r916":"r169"}"><img src="${esc(g)}" alt="" loading="lazy"></div>`:`<div class="ph ${V?"r916":"r169"}" style="--a:${k*70}deg"><span class="lab">[Фото]</span></div>`).join("")}</div>
 <p style="margin-top:44px"><a class="btn pri" href="#contacts">${V?"Обсудить похожий проект":"Обсудить проект"} →</a></p></div>
 <a class="next" href="#p-${type}-${ni}"><span class="tag">Следующая работа</span><h3>${esc(nx.t)} →</h3></a>`+contact();
}

/* player */
const pl=$("#pl"),pb=$("#pb");let lastF=null;
function embed(u){
 let m;
 if(m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/))return `<iframe src="https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
 if(m=u.match(/vimeo\.com\/(\d+)/))return `<iframe src="https://player.vimeo.com/video/${m[1]}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
 return `<video src="${esc(u)}" controls autoplay playsinline></video>`;
}
function openP(key){
 const [t,i]=key.split("-"),V=t==="vert",it=(V?VERT:FILM)[+i];if(!it)return;
 lastF=document.activeElement;
 pb.className="box "+(V?"r916":"r169");
 pb.innerHTML=it.video?`<span class="spin"></span>`+embed(it.video):`<div class="msg">[Видео] не добавлено. Вставьте ссылку в поле video этого проекта.</div>`;
 const v=$("video",pb);if(v)v.onerror=()=>pb.innerHTML=`<div class="msg">Не удалось воспроизвести видео. Проверьте ссылку.</div>`;
 const f=$("iframe,video",pb);if(f)f.addEventListener("load",()=>$(".spin",pb)?.remove());if(v)v.addEventListener("loadeddata",()=>$(".spin",pb)?.remove());
 pl.classList.add("open");document.body.style.overflow="hidden";$("#px").focus();
}
function closeP(){pl.classList.remove("open");pb.innerHTML="";document.body.style.overflow="";lastF&&lastF.focus&&lastF.focus()}
$("#px").onclick=closeP;pl.addEventListener("click",e=>{if(e.target===pl)closeP()});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&pl.classList.contains("open"))closeP();
 if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.play){e.preventDefault();openP(e.target.dataset.play)}
});
document.addEventListener("click",e=>{
 const p=e.target.closest("[data-play]");
 if(p&&!e.target.closest("a")){openP(p.dataset.play);return}
 const f=e.target.closest(".fl");
 if(f){$$(".fl").forEach(b=>b.classList.toggle("on",b===f));
  $$("#gr .card").forEach(c=>c.classList.toggle("hid",f.dataset.f!=="*"&&c.dataset.cat!==f.dataset.f))}
});

/* router */
const nav=$("#nav"),bg=$("#bg");
bg.onclick=()=>{const o=nav.classList.toggle("open");bg.setAttribute("aria-expanded",o);bg.textContent=o?"Закрыть":"Меню"};
let cur="";
function io(){
 if(!("IntersectionObserver"in window)){$$(".rv").forEach(e=>e.classList.add("in"));return}
 const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target)}}),{threshold:.08});
 $$(".rv:not(.in)").forEach(e=>o.observe(e));
}
function route(){
 nav.classList.remove("open");bg.textContent="Меню";bg.setAttribute("aria-expanded","false");
 const h=(location.hash||"#home").slice(1);
 const anchors=["work","services","about","dirs"];
 let view=h,scroll=null;
 if(anchors.includes(h)||h==="home"){view="home";scroll=h==="home"?null:h}
 else if(h==="contacts"){view=cur||"home";scroll="contact"}
 if(view!==cur){
  let m;
  app.innerHTML=view==="home"?home():view==="vertical"?listPage("vertical"):view==="film"?listPage("film"):(m=view.match(/^p-(vert|film)-(\d+)$/))?detail(m[1],+m[2]):home();
  cur=view;window.scrollTo(0,0);io();
 }
 $$("nav a[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===view));
 if(scroll){const el=document.getElementById(scroll);el&&setTimeout(()=>el.scrollIntoView({behavior:"smooth"}),30)}
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
